<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สวิตช์เปิด-ปิด Happ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: #121212; color: #f5f5f5;
      display: flex; justify-content: center;
    }
    .card {
      width: 100%; max-width: 440px;
      background: #1e1e1e; border-radius: 16px;
      padding: 20px; border: 1px solid #333;
    }
    h2 { margin: 0 0 16px; font-size: 1.25rem; text-align: center; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #262626; padding: 14px 16px; border-radius: 12px;
      border: 1px solid #383838; margin-bottom: 16px;
    }
    .toggle-title { font-weight: 600; font-size: 0.95rem; }
    .toggle-sub { font-size: 0.8rem; color: #aaa; margin-top: 2px; }
    .switch {
      position: relative; display: inline-block;
      width: 52px; height: 28px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #455a64; transition: 0.25s; border-radius: 28px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 22px; width: 22px; left: 3px; bottom: 3px;
      background-color: #fff; transition: 0.25s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #c62828; }
    input:checked + .slider:before { transform: translateX(24px); }
    label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 6px; }
    .box {
      background: #262626; padding: 10px; border-radius: 8px;
      font-size: 0.8rem; word-break: break-all; color: #90caf9;
      margin-bottom: 10px; border: 1px solid #333;
    }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 10px;
      font-size: 0.92rem; font-weight: 600; cursor: pointer;
      margin-bottom: 14px; background: #2e7d32; color: #fff;
    }
    .btn-secondary { background: #37474f; }
    .status {
      text-align: center; font-size: 0.9rem; padding: 10px;
      border-radius: 8px; background: #252525; color: #ffd54f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>สวิตช์ควบคุมโหมด Happ</h2>

    <div class="toggle-row">
      <div>
        <div class="toggle-title" id="modeLabel">โหมดปัจจุบัน: ปกติ (เปิดใช้งาน)</div>
        <div class="toggle-sub" id="modeDesc">สลับสวิตช์เพื่อดูคำแนะนำโหนดในแอป Happ</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="modeToggle" onchange="updateModeState()" />
        <span class="slider"></span>
      </label>
    </div>

    <label>ลิงก์ Subscription (Cdop.txt):</label>
    <div class="box" id="subUrl">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/Cdop.txt</div>
    <button class="btn" onclick="copyText('subUrl', 'คัดลอกลิงก์ Subscription แล้ว')">คัดลอกลิงก์ Subscription</button>

    <label>ลิงก์ Routing JSON (routing.json):</label>
    <div class="box" id="routeUrl">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/routing.json</div>
    <button class="btn btn-secondary" onclick="copyText('routeUrl', 'คัดลอกลิงก์ Routing JSON แล้ว')">คัดลอกลิงก์ Routing JSON</button>

    <div class="status" id="statusText">พร้อมใช้งาน — เปิดโหนดที่ต้องการในแอป Happ ได้เลย</div>
  </div>

  <script>
    function updateModeState() {
      const isOn = document.getElementById("modeToggle").checked;
      const labelEl = document.getElementById("modeLabel");
      const descEl = document.getElementById("modeDesc");
      const statusEl = document.getElementById("statusText");

      if (isOn) {
        labelEl.textContent = "โหมดปัจจุบัน: เปิดสวิตช์บล็อก (Block-FreeFire)";
        descEl.textContent = "ในแอป Happ ให้เลือกโหนด Block-FreeFire (127.0.0.1:1)";
        statusEl.textContent = "เปิดสวิตช์บล็อกแล้ว — เลือกโหนด Block-FreeFire ในแอป Happ";
      } else {
        labelEl.textContent = "โหมดปัจจุบัน: ปกติ (Normal-Mode)";
        descEl.textContent = "ในแอป Happ ให้เลือกโหนดปกติหรือปิดการเชื่อมต่อ";
        statusEl.textContent = "อยู่ในโหมดปกติ — เลือกโหนดปกติหรือปิดการเชื่อมต่อในแอป Happ";
      }
    }

    function copyText(id, msg) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text);
      document.getElementById("statusText").textContent = msg;
    }
  </script>
</body>
</html>
