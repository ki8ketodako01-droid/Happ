<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผงควบคุม Happ (ไม่ต้องใช้ Token)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: #121212; color: #f5f5f5;
      display: flex; justify-content: center;
    }
    .card {
      width: 100%; max-width: 440px;
      background: #1e1e1e; border-radius: 16px;
      padding: 20px; border: 1px solid #333;
    }
    h2 { margin-top: 0; font-size: 1.25rem; text-align: center; }
    label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 6px; }
    .box {
      background: #262626; padding: 10px; border-radius: 8px;
      font-size: 0.8rem; word-break: break-all; color: #90caf9;
      margin-bottom: 10px; border: 1px solid #333;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      margin-bottom: 14px; background: #2e7d32; color: #fff;
    }
    .btn-secondary { background: #37474f; }
    .status {
      text-align: center; font-size: 0.9rem; padding: 10px;
      border-radius: 8px; background: #252525; color: #ffd54f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ลิงก์คอนฟิก Happ ของฉัน</h2>

    <label>1. ลิงก์ Subscription (รวมทั้งโหมดปกติและโหมดบล็อก):</label>
    <div class="box" id="subUrl">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/Cdop.txt</div>
    <button class="btn" onclick="copyText('subUrl')">คัดลอกลิงก์ Subscription</button>

    <label>2. ลิงก์ Routing JSON (กฎบล็อกเฉพาะ Free Fire):</label>
    <div class="box" id="routeUrl">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/routing.json</div>
    <button class="btn btn-secondary" onclick="copyText('routeUrl')">คัดลอกลิงก์ Routing JSON</button>

    <div class="status" id="statusText">พร้อมใช้งาน — กดคัดลอกลิงก์ไปวางในแอป Happ ได้เลย</div>
  </div>

  <script>
    function copyText(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text);
      document.getElementById("statusText").textContent = "คัดลอกลิงก์เรียบร้อยแล้ว!";
    }
  </script>
</body>
</html>
