<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สวิตช์เปิด-ปิด Happ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: #121212; color: #f5f5f5;
      display: flex; justify-content: center;
    }
    .card {
      width: 100%; max-width: 440px;
      background: #1e1e1e; border-radius: 16px;
      padding: 20px; border: 1px solid #333;
    }
    h2 { margin: 0 0 16px; font-size: 1.25rem; text-align: center; }
    .toggle-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #262626; padding: 14px 16px; border-radius: 12px;
      border: 1px solid #3a3a3a; margin-bottom: 14px;
    }
    .title { font-weight: 700; font-size: 1rem; }
    .sub { font-size: 0.82rem; color: #bdbdbd; margin-top: 3px; }
    .switch {
      position: relative; display: inline-block;
      width: 54px; height: 30px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #455a64; transition: 0.25s; border-radius: 30px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 24px; width: 24px; left: 3px; bottom: 3px;
      background-color: #fff; transition: 0.25s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(24px); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      margin-bottom: 10px; background: #37474f; color: #fff;
    }
    .box {
      background: #262626; padding: 10px; border-radius: 8px;
      font-size: 0.8rem; word-break: break-all; color: #90caf9;
      margin-bottom: 12px; border: 1px solid #333;
    }
    .status {
      text-align: center; font-size: 0.9rem; padding: 11px;
      border-radius: 8px; background: #252525; color: #ffd54f;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>สวิตช์เปิด-ปิด Happ</h2>

    <div class="toggle-box">
      <div>
        <div class="title" id="stateTitle">สถานะ: ปิด (ใช้งานปกติ)</div>
        <div class="sub" id="stateSub">กดสวิตช์เพื่อเปิดหรือปิดโหมดที่ตั้งค่าไว้</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="powerSwitch" onchange="handleSwitch()" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="box" id="subLink">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/Cdop.txt</div>
    <button class="btn" onclick="copyLink('subLink', 'คัดลอกลิงก์ Subscription แล้ว')">คัดลอกลิงก์ Subscription</button>

    <div class="box" id="routeLink">https://raw.githubusercontent.com/ki8ketodako01-droid/Happ/main/routing.json</div>
    <button class="btn" onclick="copyLink('routeLink', 'คัดลอกลิงก์ Routing JSON แล้ว')">คัดลอกลิงก์ Routing JSON</button>

    <div class="status" id="statusBox">พร้อมใช้งาน — เปิดหรือปิดสวิตช์ได้ตามต้องการ</div>
  </div>

  <script>
    function handleSwitch() {
      const isEnabled = document.getElementById("powerSwitch").checked;
      const titleEl = document.getElementById("stateTitle");
      const subEl = document.getElementById("stateSub");
      const statusEl = document.getElementById("statusBox");

      if (isEnabled) {
        titleEl.textContent = "สถานะ: เปิด (ใช้งานโหมดที่ตั้งค่าไว้)";
        subEl.textContent = "เปิดเชื่อมต่อในแอป Happ เพื่อใช้งานตามกฎและโหนดที่เลือก";
        statusEl.textContent = "เปิดสวิตช์แล้ว — ตรวจสอบให้แน่ใจว่ากดเชื่อมต่อในแอป Happ แล้ว";
      } else {
        titleEl.textContent = "สถานะ: ปิด (ใช้งานปกติ)";
        subEl.textContent = "ปิดการเชื่อมต่อในแอป Happ หรือเลือกโหนดปกติเพื่อเล่นได้ตามปกติ";
        statusEl.textContent = "ปิดสวิตช์แล้ว — หากยังเปิด VPN ใน Happ อยู่ สามารถกดปิดที่ปุ่มกลางได้ทันที";
      }
    }

    function copyLink(id, msg) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text);
      document.getElementById("statusBox").textContent = msg;
    }
  </script>
</body>
</html>
